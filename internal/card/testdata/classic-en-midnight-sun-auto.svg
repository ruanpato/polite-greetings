<svg xmlns="http://www.w3.org/2000/svg" id="pg" width="440" height="100" viewBox="0 0 440 100" role="img" aria-labelledby="pg-title" xml:lang="en">
<title id="pg-title">Good evening. No sunset today.</title>
<style>#pg .bg{fill:#FFFFFF;stroke:#474555;stroke-opacity:.25}#pg .a{fill:#007A5A}#pg .as{stroke:#007A5A}#pg .t{fill:#474555}#pg .ts{stroke:#474555}#pg .k{stroke:#FFFFFF}@media (prefers-color-scheme:dark){#pg .bg{fill:#474555;stroke:#C8FCEA;stroke-opacity:.25}#pg .a{fill:#00C894}#pg .as{stroke:#00C894}#pg .t{fill:#C8FCEA}#pg .ts{stroke:#C8FCEA}#pg .k{stroke:#474555}}</style>
<rect class="bg" x=".5" y=".5" width="439" height="99" rx="12"/>
<g transform="translate(50 50)"><mask id="pg-moon"><circle r="15" fill="#fff"/><circle cx="7" cy="-6" r="12.5" fill="#000"/></mask><circle class="a" r="15" mask="url(#pg-moon)"/></g>
